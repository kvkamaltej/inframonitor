# Loki configuration for the Infra Monitor full profile. Single-binary, filesystem
# storage, no clustering -- appropriate for one host collecting its own container
# logs.
#
# THE IMPORTANT PART: retention.
#
# The previous configuration had no `compactor` block and no `retention_period`.
# Loki's default retention is "keep everything forever", and nothing was deleting
# chunks, so the loki_data volume grew without bound until the disk filled. Log
# volume is the one thing in this stack that grows on its own.
#
# Retention here is a pair of settings that must both be present:
#   limits_config.retention_period   -- how long to keep logs (168h = 7 days)
#   compactor.retention_enabled      -- whether anything actually deletes them
# Setting only the first is the same as setting neither: the period is recorded
# and ignored. To keep logs longer, raise retention_period; deletions then happen
# within roughly compaction_interval + retention_delete_delay of expiry.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  # Without this, retention_period below is inert.
  retention_enabled: true
  # Grace period between an entry expiring and its chunk being deleted.
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  # Required whenever retention_enabled is true: where delete requests are kept.
  delete_request_store: filesystem

limits_config:
  # 7 days. This is the setting to change if you need longer retention; the
  # loki_data volume is sized by it.
  retention_period: 168h
  # Anything older than the retention window would be deleted immediately after
  # ingest, so reject it at the door and say so in the response instead.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  allow_structured_metadata: true
  volume_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  # Log-based alerting: some conditions are only visible in the log text, not in any metric.
  # The nginx request-timeout rule (rules/fake/nginx.yml) is the case in point -- the stock nginx
  # metrics exporter exposes connection counts, never per-request duration, so ">30s" can only be
  # read off the access log. Loki evaluates these LogQL rules and sends firings to the SAME
  # Alertmanager Prometheus uses, so they land in the app's Alerts view alongside metric alerts.
  # "fake" is the tenant id Loki uses when auth_enabled is false; rules live under rules/<tenant>/.
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  evaluation_interval: 30s
  poll_interval: 1m

# Off by default here. It phones home to Grafana Labs with usage statistics.
analytics:
  reporting_enabled: false
